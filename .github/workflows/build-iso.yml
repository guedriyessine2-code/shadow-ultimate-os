
name: Build SHADOW ULTIMATE OS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo rm -rf /usr/local/share/boost /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: Unpack source
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir source
          unzip -q SHADOW_ULTIMATE_OS_build_source_v3.zip -d source

      - name: Fix Debian security repository
        run: |
          set -eu
          find source -type f ! -name '*.zip' -exec grep -Il 'trixie/updates' {} \; | while read -r file; do
            sed -i 's#http://security.debian.org trixie/updates#https://security.debian.org/debian-security trixie-security#g' "$file"
          done
          if grep -RIn 'trixie/updates' source; then
            echo "Old Debian security repository still exists"
            exit 1
          fi
          echo "Security repository check completed"

      - name: Build ISO
        working-directory: source
        run: |
          chmod +x build.sh
          sudo ./build.sh

      - name: Check ISO
        run: |
          set -e
          ISO=$(find source -type f -iname '*.iso' -print -quit)
          test -n "$ISO"
          test "$(stat -c%s "$ISO")" -le 7516192768

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-ULTIMATE-OS-ISO
          path: source/**/*.iso
          if-no-files-found: error
          retention-days: 3
